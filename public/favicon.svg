<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <!-- Blue background -->
  <rect width="60" height="30" fill="#012169"/>

  <!-- White cross -->
  <rect x="0" y="12" width="60" height="6" fill="white"/>
  <rect x="24" y="0" width="12" height="30" fill="white"/>

  <!-- Red cross -->
  <rect x="0" y="13.5" width="60" height="3" fill="#c8102e"/>
  <rect x="27" y="0" width="6" height="30" fill="#c8102e"/>

  <!-- Diagonal white lines -->
  <polygon points="0,0 60,30 60,30 0,0" fill="none" stroke="white" stroke-width="4"/>
  <polygon points="60,0 0,30 0,30 60,0" fill="none" stroke="white" stroke-width="4"/>

  <!-- Diagonal red lines -->
  <polygon points="0,0 60,30 60,30 0,0" fill="none" stroke="#c8102e" stroke-width="2"/>
  <polygon points="60,0 0,30 0,30 60,0" fill="none" stroke="#c8102e" stroke-width="2"/>
</svg>
